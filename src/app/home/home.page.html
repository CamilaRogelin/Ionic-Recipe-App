<ion-header>
  <ion-toolbar>
    <ion-title>My Vegan Recipe App</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <ion-list>
    <ion-item
      *ngFor="let r of recipes"
      (click)="openRecipe(r.id)"
    >
      <ion-label>
        <h2>{{ r.title }}</h2>
        <p>{{ r.ingredients }}</p>
      </ion-label>
    </ion-item>
  </ion-list>
</ion-content>
